<!doctype html><html lang="{{ initial_language|default('en') }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedExplain · Reset password</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="auth-page"><main class="auth-simple"><a class="brand" href="{{ url_for('login') }}"><span class="brand-mark">✚</span><span><b>MedExplain</b><small>HEALTH, MADE CLEAR</small></span></a><div class="auth-panel"><div class="auth-panel-top"><span class="auth-kicker">MEDEXPLAIN ACCOUNT</span><select class="lang" onchange="location.href='/set-language/'+this.value+'?next='+encodeURIComponent(location.pathname)"><option value="en" {% if initial_language|default('en')=='en' %}selected{% endif %}>English</option><option value="hi" {% if initial_language|default('en')=='hi' %}selected{% endif %}>हिन्दी</option><option value="pa" {% if initial_language|default('en')=='pa' %}selected{% endif %}>ਪੰਜਾਬੀ</option></select></div><div class="auth-heading"><h2>{{ tr('Choose a new password') }}</h2><p>Use at least 10 characters with a letter and a number.</p></div>{% if error %}<div class="auth-alert error">{{ tr(error) }}</div>{% endif %}{% if token %}<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ tr('New password') }}<span class="auth-input"><input type="password" name="password" minlength="10" required></span></label><label>{{ tr('Confirm new password') }}<span class="auth-input"><input type="password" name="confirm_password" minlength="10" required></span></label><button class="auth-submit" type="submit">{{ tr('Reset password') }} →</button></form>{% endif %}<p class="auth-switch"><a href="{{ url_for('login') }}">{{ tr('Back to login') }}</a></p></div></main></body></html>
