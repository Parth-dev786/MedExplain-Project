<!doctype html><html lang="{{ initial_language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedExplain · {{ tr('Reset password') }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="auth-page"><main class="auth-simple"><a class="brand" href="{{ url_for('login') }}"><span class="brand-mark">✚</span><span><b>MedExplain</b><small>HEALTH, MADE CLEAR</small></span></a><div class="auth-panel"><div class="auth-panel-top"><span class="auth-kicker">{{ tr('ACCOUNT RECOVERY') }}</span><select class="lang" onchange="location.href='/set-language/'+this.value+'?next='+encodeURIComponent(location.pathname)"><option value="en" {% if initial_language=='en' %}selected{% endif %}>English</option><option value="hi" {% if initial_language=='hi' %}selected{% endif %}>हिन्दी</option><option value="pa" {% if initial_language=='pa' %}selected{% endif %}>ਪੰਜਾਬੀ</option></select></div><div class="auth-heading"><div class="auth-icon">⌑</div><h2>{{ tr('Reset password') }}</h2><p>{{ tr('Enter the email address associated with your account.') }}</p></div>{% if message %}<div class="auth-alert success">{{ tr(message) }}</div>{% endif %}<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>{{ tr('Email address') }}<span class="auth-input"><span>✉</span><input type="email" name="email" autocomplete="email" required></span></label><button class="auth-submit" type="submit">{{ tr('Send reset link') }} <span>→</span></button></form><p class="auth-switch"><a href="{{ url_for('login') }}">← {{ tr('Back to login') }}</a></p></div></main></body></html>
